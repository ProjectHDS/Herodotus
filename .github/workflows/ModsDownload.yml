name: ModsDownload
on:
    workflow_dispatch:
jobs:
    download:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "true"

            - uses: prefix-dev/setup-pixi@v0.8.10
              with:
                  pixi-version: v0.48.2
                  cache: true

            - name: Run downloader
              run: pixi run download-mods '${{ secrets.CF_TOKEN }}' ./mods

            - name: Upload a Build Artifact
              uses: actions/upload-artifact@v2
              with:
                  name: Herodotus-Mods
                  path: mods
                  retention-days: 5
