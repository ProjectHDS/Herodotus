name: TestRunner
on:
  workflow_dispatch:
  # push:
  #   branches: [develop]
  # pull_request:
  #   branches: [develop]

jobs:
  TestRunner:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        if: ${{ github.event_name == 'push' }}
        uses: styfle/cancel-workflow-action@0.9.0
        with:
          access_token: ${{ secrets.ACTION_TOKEN }}

      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.48.2
          cache: true

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'zulu'

      - name: Restore assets
        id: runner-download-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            OpenJDK21U-jdk_x64_linux_hotspot_21.0.7_6.tar.gz
            gml-linux.gz
            forge-install-bootstrapper.jar
            forge-1.12.2-14.23.5.2860-installer.jar
          key: ${{ runner.os }}-runner-download-cache

      - name: Run game test
        run: pixi run test-modpack '${{ secrets.CF_TOKEN }}' ./gml/mods ./gml/.minecraft/mods/.index 

      - name: Save assets
        id: runner-download-cache-save
        uses: actions/cache/save@v4
        with:
          path: |
            OpenJDK21U-jdk_x64_linux_hotspot_21.0.7_6.tar.gz
            gml-linux.gz
            forge-install-bootstrapper.jar
            forge-1.12.2-14.23.5.2860-installer.jar
          key: ${{ steps.runner-download-cache-restore.outputs.cache-primary-key }}